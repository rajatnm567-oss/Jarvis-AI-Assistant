name: jarvis_assistant
description: "Iron Man Jarvis - AI Assistant for Android & iPhone with voice control, self-repair, and auto-updates."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Google Gemini AI
  google_generative_ai: ^0.3.0
  
  # Voice Recognition
  speech_to_text: ^6.6.0
  flutter_tts: ^0.5.0
  
  # Phone Automation & Control
  android_intent_plus: ^4.0.0
  device_apps: ^1.4.0
  url_launcher: ^6.1.0
  
  # Self-Repair & Updates
  upgrader: ^9.0.0
  package_info_plus: ^4.0.0
  http: ^1.1.0
  path_provider: ^2.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # UI & Design
  flutter_riverpod: ^2.4.0
  go_router: ^10.0.0
  google_fonts: ^6.1.0
  lottie: ^2.4.0
  
  # Notifications
  flutter_local_notifications: ^14.0.0
  
  # Logging & Analytics
  logger: ^2.0.0
  firebase_analytics: ^10.0.0
  firebase_core: ^2.16.0
  
  # Error Handling & Crash Reporting
  sentry_flutter: ^7.10.0
  
  # Device Info
  device_info_plus: ^9.0.0
  
  # Background Tasks
  workmanager: ^0.4.0
  
  # Network State
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
  
  fonts:
    - family: JarvisFont
      fonts:
        - asset: assets/fonts/JarvisFont-Regular.ttf
        - asset: assets/fonts/JarvisFont-Bold.ttf
          weight: 700
